<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 — Reserve a table</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body class="task3">
<main class="container py-4 py-md-5">
    <section class="form-panel mx-auto" aria-labelledby="page-title">
        <header class="panel-header">
            <h1 id="page-title">Reserve a table</h1>
        </header>

        <div class="panel-body">
            <p class="mb-4">Fields marked * are required.</p>

            <form action="#" method="post">
                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label" for="guest-name">Your name *</label>
                        <input class="form-control" type="text"
                               id="guest-name" name="guest_name"
                               autocomplete="name" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="guest-email">Email *</label>
                        <input class="form-control" type="email"
                               id="guest-email" name="guest_email"
                               autocomplete="email" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="guest-phone">Phone *</label>
                        <input class="form-control" type="tel"
                               id="guest-phone" name="guest_phone"
                               autocomplete="tel" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="guests">Guests *</label>
                        <input class="form-control" type="number"
                               id="guests" name="guests"
                               min="1" step="1" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="reservation-date">Date *</label>
                        <input class="form-control" type="date"
                               id="reservation-date" name="reservation_date" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="meal">Meal *</label>
                        <select class="form-select" id="meal" name="meal" required>
                            <option value="">Choose...</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                        </select>
                    </div>

                    <fieldset class="col-12">
                        <legend class="form-label">Seating *</legend>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"
                                   id="inside" name="seating" value="inside" required>
                            <label class="form-check-label" for="inside">
                                Inside
                            </label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"
                                   id="terrace" name="seating" value="terrace" required>
                            <label class="form-check-label" for="terrace">
                                Terrace
                            </label>
                        </div>
                    </fieldset>

                    <div class="col-12">
                        <label class="form-label" for="comments">
                            Comments (optional)
                        </label>
                        <textarea class="form-control"
                                  id="comments" name="comments"
                                  rows="4" placeholder="Any special requests?"></textarea>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   id="terms" name="terms" value="accepted" required>
                            <label class="form-check-label" for="terms">
                                I agree to the terms *
                            </label>
                        </div>
                    </div>
                </div>

                <button class="btn btn-find w-100 mt-4" type="submit">
                    Reserve
                </button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
