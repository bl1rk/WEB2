<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1 — Train ticket</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&amp;display=swap">
    <link rel="stylesheet" href="style.css">
</head>

<body class="task1">
<main class="container py-4 py-md-5">
    <section class="form-panel mx-auto" aria-labelledby="page-title">
        <header class="panel-header">
            <h1 id="page-title">Book a train ticket</h1>
        </header>

        <div class="panel-body">
            <form action="#" method="get">
                <fieldset class="mb-4">
                    <legend class="visually-hidden">Trip type</legend>

                    <div class="btn-group trip-toggle">
                        <input class="btn-check" type="radio"
                               id="one-way" name="trip" value="one-way">
                        <label class="btn" for="one-way">One way</label>

                        <input class="btn-check" type="radio"
                               id="round-trip" name="trip" value="round-trip">
                        <label class="btn" for="round-trip">Round trip</label>
                    </div>
                </fieldset>

                <div class="row g-3">
                    <div class="col-12 col-md-6">
                        <div class="form-floating">
                            <input class="form-control" type="text"
                                   id="from" name="from"
                                   placeholder="Astana" required>
                            <label for="from">From</label>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <div class="form-floating">
                            <input class="form-control" type="text"
                                   id="to" name="to"
                                   placeholder="Almaty" required>
                            <label for="to">To</label>
                        </div>
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label" for="departure">Departure</label>
                        <input class="form-control" type="date"
                               id="departure" name="departure" required>
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label" for="return-date">Return</label>
                        <input class="form-control" type="date"
                               id="return-date" name="return_date">
                    </div>

                    <div class="col-12 col-md-4">
                        <label class="form-label" for="passengers">Passengers</label>
                        <select class="form-select"
                                id="passengers" name="passengers" required>
                            <option value="">Choose...</option>
                            <option value="1">1 adult</option>
                            <option value="2">2 adults</option>
                            <option value="3">3 adults</option>
                            <option value="4">4 adults</option>
                            <option value="5">5 adults</option>
                            <option value="6">6 adults</option>
                        </select>
                    </div>

                    <fieldset class="col-12">
                        <legend class="form-label">Carriage class</legend>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"
                                   id="seat" name="carriage" value="seat" required>
                            <label class="form-check-label" for="seat">Seat</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"
                                   id="coupe" name="carriage" value="coupe" required>
                            <label class="form-check-label" for="coupe">Coupé</label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"
                                   id="sleeper" name="carriage" value="sleeper" required>
                            <label class="form-check-label" for="sleeper">Sleeper</label>
                        </div>
                    </fieldset>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="phone">Phone</label>

                        <div class="input-group">
                            <span class="input-group-text" id="phone-prefix">+7</span>
                            <input class="form-control" type="tel"
                                   id="phone" name="phone"
                                   placeholder="701 234 56 78"
                                   autocomplete="off"
                                   aria-describedby="phone-prefix" required>
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email"
                               id="email" name="email"
                               placeholder="name@example.com"
                               autocomplete="email" required>
                    </div>

                    <div class="col-12">
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox"
                                   role="switch" id="sms"
                                   name="sms" value="yes">
                            <label class="form-check-label" for="sms">
                                Also send the ticket by SMS
                            </label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox"
                                   id="agreement" name="agreement"
                                   value="accepted" required>
                            <label class="form-check-label" for="agreement">
                                I agree with the carriage rules
                            </label>
                        </div>
                    </div>
                </div>

                <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2 mt-4">
                    <button class="btn btn-clear" type="reset">Clear</button>
                    <button class="btn btn-find" type="submit">Find trains</button>
                </div>
            </form>
        </div>
    </section>
</main>
</body>
</html>
